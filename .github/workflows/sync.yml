name: addons-sync
# The reviewed install list IS the manifest (contract clause 9): every entry
# below is a PR-reviewed {addon, ref, tenant} install for this org's tenants.
#
# Rules encoded by scripts/addon_tools.py at validate time:
#   - literal matrix entries only (no `${{ }}` inside entries) so the index
#     can be materialized deterministically
#   - external addon entries carry a pinned ref (SHA or protected v<semver> tag)
#   - no duplicate (addon, tenant) pairs — one statefile serves one version
#
# FILL ME: repo *Variables* (not secrets) must carry:
#   ADDONS_EXECUTOR_ROLE_ARN — the role bootstrap/ minted
# Until it is set, `apply` and `sweep` skip (nothing to assume a role with) so
# an unconfigured fork is green rather than red; `prepare-index` still runs and
# validates the matrix on every push.
# The runner action is pinned below; bump that SHA deliberately to move.

on:
  push:
    branches: [main]         # main merges only — no cron
  workflow_dispatch: {}      # operator escape hatch

permissions:
  contents: read
  id-token: write            # for the OIDC role assumption

concurrency:
  group: addons-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  ORGANIZATION_ID: "0000000000000000000000000000000000000000"  # ← this org's DB unique id
  AWS_REGION: us-east-1
  STATE_BUCKET: namazu-cloud-instance
  CLUSTER_NAME: ""
  EKS_ROLE_ARN: ""

jobs:
  prepare-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # addon_tools.py imports yaml; the index step below is the first thing
      # to touch it, so install here (validate.yml does the same).
      - run: python3 -m pip install --quiet 'PyYAML>=6'

      - name: Materialize the index from THIS workflow's matrix
        run: |
          python3 scripts/addon_tools.py build-index \
            --workflow .github/workflows/sync.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --out addons.index.json
      - uses: actions/upload-artifact@v4
        with:
          name: addons-index
          path: addons.index.json

  apply:
    # Nothing to assume without the executor role: skip rather than fail the
    # whole run on an empty role-to-assume (unconfigured fork / this template).
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.ADDONS_EXECUTOR_ROLE_ARN != ''
    needs: prepare-index
    runs-on: ubuntu-latest
    strategy:
      matrix:
        install:
          # ── reviewed installs ────────────────────────────────────────────
          # repo-less entry = THIS fork's private local root (repo defaults
          # to the job's own repository; ref defaults to this push's SHA):
          # variant is REQUIRED on every entry — every install is the triple
          # (addon, variant, tenant), statefile addon_<id>_<variant>.tfstate:
          - { variant: local, instance: "acme-prod", region: "us-east-1", bucket: "<SET-ME: your fleet tenant-state bucket>" }
          # external addons are pinned (SHA or protected v<semver> tag):
          # - { addon: "NamazuStudios/namazu-cloud-addon-waf", ref: "v1.2.0", variant: main,
          #     region: "us-east-1", bucket: "<SET-ME: your fleet tenant-state bucket>",
          #     instance: "acme-prod" }
          # - { addon: "NamazuStudios/namazu-cloud-addon-waf", ref: "v1.2.0",
          #     region: "us-east-1", bucket: "<SET-ME: your fleet tenant-state bucket>",
          #     workspace: "ws-9561" }
    steps:
      - uses: actions/checkout@v4        # fork checkout: local roots live here
      - name: exec-plugin on PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ADDONS_EXECUTOR_ROLE_ARN }}
          aws-region: ${{ matrix.install.region || env.AWS_REGION }}
      - name: apply addon
        uses: NamazuStudios/namazu-cloud-addon-runner@0b1de84103ad60868ece5a71634751509022d01c
        with:
          mode: apply
          repo: ${{ matrix.install.addon }}
          ref: ${{ matrix.install.ref }}
          region: ${{ matrix.install.region || env.AWS_REGION }}
          bucket: ${{ matrix.install.bucket || env.STATE_BUCKET }}
          instance: ${{ matrix.install.instance }}
          workspace: ${{ matrix.install.workspace }}
          organization_id: ${{ env.ORGANIZATION_ID }}
          eks_cluster_name: ${{ env.CLUSTER_NAME }}
          eks_cluster_role_arn: ${{ env.EKS_ROLE_ARN }}

  sweep:
    # Same trigger as apply (merge or dispatch) - no cron: the merge that
    # removes an entry does the destroying.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.ADDONS_EXECUTOR_ROLE_ARN != ''
    needs: prepare-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # local-root destroys need this checkout
      - name: exec-plugin on PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ADDONS_EXECUTOR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with: { name: addons-index }
      - name: sweep orphans
        uses: NamazuStudios/namazu-cloud-addon-runner@0b1de84103ad60868ece5a71634751509022d01c
        with:
          mode: sweep
          index_file: addons.index.json
          region: ${{ env.AWS_REGION }}
          bucket: ${{ env.STATE_BUCKET }}
          organization_id: ${{ env.ORGANIZATION_ID }}
          eks_cluster_name: ${{ env.CLUSTER_NAME }}
          eks_cluster_role_arn: ${{ env.EKS_ROLE_ARN }}
          tidy: 'true'
